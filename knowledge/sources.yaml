# Weather-safety knowledge sources.
#
# Every document the advice engine may cite is registered here. Nothing is
# fetched from the open internet at request time: ingestion is an offline,
# reviewed step, and this file is the record of what was reviewed.
#
# `enabled: false` removes a source from all future retrieval without deleting
# its history, which is what makes a withdrawn or superseded document safe to
# retire.
#
# Editing rules:
#   * `id` is permanent. Chunk ids derive from it, so changing one orphans
#     every citation ever emitted.
#   * Bump `version` whenever `raw/<id>.md` changes. Ingestion replaces all
#     chunks for a document when its version changes, and leaves them alone
#     when it does not — that is what makes re-ingestion idempotent.
#   * `last_verified_at` is a human action. It records that a person opened
#     the source URL and confirmed the local copy still matches.

