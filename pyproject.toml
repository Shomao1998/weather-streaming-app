[project]
name = "weather-streaming-app"
version = "1.0.0"
description = "Streaming weather ingestion, lake storage and monitoring on Azure"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/functions"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:weather.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/functions", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",   # function calls in argument defaults — used deliberately for DI
    "SIM105", # contextlib.suppress reads worse than try/except here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The Azure Functions Python worker introspects this module's annotations to
# discover bindings, and does not understand PEP 585 builtin generics for a
# cardinality=MANY binding — it fails indexing silently and the host then
# reports zero functions. typing.List is required here, deprecated or not.
"src/functions/function_app.py" = ["UP006", "UP035"]
